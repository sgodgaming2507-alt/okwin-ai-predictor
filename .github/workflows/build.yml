name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
      env:
        BUILDOZER_ALLOW_ROOT: "1"
        CI: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Android APK
        run: |
          buildozer -v --warn-on-root=0 android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKWin-AI-Predictor-APK
          path: bin/*.apk
